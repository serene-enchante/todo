<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Steps">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Steps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app">
    <aside id="library" class="library sidebar" aria-label="Lessons">
      <div class="library-top">
        <select class="book-picker" id="bookSelect" aria-label="Book"></select>
        <button class="upload-button" id="uploadButton" type="button" aria-label="Upload lesson" title="Upload lesson">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>
          <span>Upload lesson</span>
        </button>
        <input id="lessonFile" type="file" accept="application/json,.json" hidden>
        <label class="schema-button" title="Load a reusable schema mapping">
          <span>Schema</span><input id="schemaFile" type="file" accept="application/json,.json" hidden>
        </label>
        <button class="drive-button" id="driveSyncButton" type="button" title="Sync lessons and progress with Google Drive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 18.5h11a4 4 0 0 0 .3-8 6 6 0 0 0-11.6-1.4A4.5 4.5 0 0 0 6.5 18.5Z"/><path d="M12 11v7m0 0-2.5-2.5M12 18l2.5-2.5"/></svg>
          <span>Sync Drive</span>
        </button>
        <input id="bookFile" type="file" accept="application/pdf,.pdf" hidden>
      </div>
      <div id="lessonList" class="lesson-list"></div>
      <div id="emptyState" class="empty-state" hidden></div>
    </aside>

    <section id="lessonView" class="lesson-view" hidden>
      <header class="lesson-header">
        <button class="back-button" id="backButton" type="button" aria-label="Back to lessons" title="Back to lessons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m0 0 7-7m-7 7 7 7"/></svg></button>
        <h1 id="lessonTitle"></h1>
        <button class="copy-step-button" id="copyStepButton" type="button" aria-label="Copy lesson and current step as JSON and open Gemini" title="Copy for Gemini">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4h9A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H16"/><rect x="4" y="8" width="12" height="12" rx="1.5"/></svg>
        </button>
      </header>
      <div class="lesson-layout">
        <aside class="step-map" aria-label="Step progress"><div id="stepDots" class="step-dots"></div></aside>
        <div class="step-stage" id="stepStage" tabindex="0" aria-live="polite">
          <div class="step-content">
            <article id="stepCard" class="step-card"></article>
            <span id="stepCounter" class="step-counter"></span>
          </div>
        </div>
      </div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
